# RustyBar for Windows. Copy to %APPDATA%\rustybar\rustybar.toml. Every key below shows its default: delete what you
# don't change. The bar reloads by itself when you save this file. A rustybar.local.toml next to it, if there is one,
# goes over it, table by table (for what stays out of a shared dotfiles repo: a server, the accounts).

[bar]
height = 40          # the bar, in DIPs; the pills are centered in it
margin = 8           # from the screen edges to the first and last pill
reserve = true       # reserve the strip, as the taskbar does: maximized windows stop under it
screens = "all"      # all: a bar on every screen; primary: on the main one alone
always_compact = []  # widgets in their compact form everywhere, room or not ("system")
popup_gap = 6        # from the bottom of the bar to a popup

[theme]
# The palette. windows: light or dark and the accent color of Windows, followed as they change.
# Or catppuccin-mocha, catppuccin-macchiato, catppuccin-frappe, catppuccin-latte, dracula,
# everforest-dark, everforest-light, gruvbox-dark, gruvbox-light, kanagawa-wave, kanagawa-dragon,
# kanagawa-lotus, nord, one-dark, one-light, rose-pine, rose-pine-moon, rose-pine-dawn,
# solarized-dark, solarized-light, tokyo-night, tokyo-night-storm, tokyo-night-moon,
# tokyo-night-day. Every one has Catppuccin's color names.
preset = "windows"
primary = "accent"               # the highlight of the current desktop, the bars in the popups
font = "Segoe UI Variable Text"
font_size = 13
small_size = 11
pill_height = 28
pill_radius = 14
pill_border = 1
pill_padding = 10
item_gap = 8                     # between pills
popup_radius = 8                 # the corners of a popup, as Windows 11's flyouts
popup_border = 1
row_radius = 4                   # the corners of what can be clicked in a popup
animations = true                # also off when Windows has animations off, or a game is in front

# Override or add palette colors, by name or hex:
# [theme.colors]
# base = "#1e1e2e"

[layout]
# Built-in widgets, and those written in Lua (widgets\*.lua next to this file, see the README)
left = ["power", "workspaces", "front_app"]
center = ["media"]
right = ["network", "audio", "system", "clock"]

[games]
# Executables that count as a game while in front, even in a window: no animations, and system
# stops reading (the clock goes on). Any app that covers a screen without a title bar (a game, a
# video, F11) hides the bar of that screen anyway.
apps = []                        # e.g. ["wow.exe", "cs2.exe"]

# Options of each widget, by its name in [layout]:
#
# [widgets.clock]
# date = "ddd dd/MM"             # a Windows date picture; "" for the time alone
# # The page a click on a day of the calendar opens; "" for days that can't be clicked
# open = "https://calendar.google.com/calendar/r/day/{year}/{month}/{day}"
# timezone = ""                  # another place's time: "Asia/Tokyo", "UTC", "Tokyo Standard Time"
#
# [widgets.workspaces]
# single = false                 # show the pill with a single desktop too
#
# claude isn't in the default layout: it runs Claude Code for under a second every 5 minutes
# (~0.4 s of CPU, ~190 MB while it runs). Add "claude" to [layout] to have it.
# [widgets.claude]
# dir = ""                       # Claude Code's config dir; "" for ~\.claude
# color = "#d97757"              # the spark's color
# path = ""                      # claude.exe; "" finds it (PATH, ~\.local\bin, the Claude app)
# warning = 75
# critical = 90
# A second account: a widget of its own with its config dir.
# [widgets.claude_work]
# type = "claude"
# dir = "~/.claude-work"
# color = "#6a9bcc"
#
# [widgets.media]
# paused = true                  # show a paused track, dimmed; false hides the pill while paused
# cover = true                   # the cover in the popup; false never reads it
# cover_colors = true            # the popup in the cover's colors; false keeps the theme's
#
# events isn't in the default layout: it needs your calendars' secret iCal addresses, each in
# Credential Manager: Get-Clipboard | rustybar secret set events-Work
# [widgets.events]
# calendars = [{ name = "Work", color = "sky" }, { name = "Personal", color = "green" }]
# soon = 30                      # the start time turns yellow this many minutes before...
# sooner = 15                    # ...peach...
# imminent = 5                   # ...and red
# interval = 15                  # minutes between downloads
# open = "https://calendar.google.com/calendar/r/day/{year}/{month}/{day}"
#
# home isn't in the default layout: it needs a Home Assistant server, and its token in Credential
# Manager: Get-Clipboard | rustybar secret set home-assistant
# [widgets.home]
# server = "http://homeassistant.local:8123"
# dashboard = "/"                # what "Open Home Assistant" opens: a path on the server or an address
# [[widgets.home.groups]]        # a title and its tiles, as many groups as you like
# title = "Lights"
# entities = ["light.living_room", { id = "switch.desk_lamp", name = "Desk", icon = "EA80" }]
# [widgets.home.printer]         # a 3D printer: a wide tile, and its progress in the pill while it prints
# plug = "switch.printer"
# off = "script.printer_off"     # turns it off, at a second click
# status = "sensor.printer_status"
# progress = "sensor.printer_progress"   # %
# remaining = "sensor.printer_remaining" # hours
#
# [widgets.system]
# interval = 5                   # seconds between readings (every 2 while the popup is open)
# warning = 75                   # CPU, GPU and memory turn yellow from this percentage...
# critical = 90                  # ...and red from this one
# disk_warning = 90              # the same for the disks in the popup, in percent used
# disk_critical = 95
# gpu = true                     # false: no GPU in the pill and the popup
#
# Two widgets of the same kind: give the second a name of its own and its type.
# [widgets.clock_tokyo]
# type = "clock"
# timezone = "Asia/Tokyo"        # IANA or Windows' name (Tokyo Standard Time); "" for this PC's
# date = "'Tokyo'"               # text between quotes, to tell the clocks apart
